# RMX5303 (realme C71) package classification database.
#
# IMPORTANT: this file is a *starting candidate set*, not a validated
# on-device inventory. Per the master plan (section 8/10), ReLite must
# discover the actual installed package set from the live device via
# `relite scan` / `relite analyze` before removing anything — this file
# alone does not authorize any action.
#
# Entries below are seeded from package names that are publicly and
# consistently documented (by multiple independent community debloat
# references, including Universal Android Debloater NG, used only as a
# secondary signal per section 10) as realme/ColorOS-family promotional,
# recommendation, or analytics components. Every entry is intentionally
# capped at `confidence: medium` until it has been cross-checked against
# an actual RMX5303 `pm list packages -f` + `dumpsys package` dump — see
# findings.md for validation status. Nothing here is `confidence: high`
# yet for that reason.
#
# Schema: see relite/classifier.py (PackageClassification / VALID_*).

- package: com.heytap.market
  category: [cloud, optional]
  confidence: medium
  action:
    safe: keep
    performance: disable
    maximum: disable
  risk: medium
  reason: >
    OEM app store (realme/heytap family). Disabling removes background
    promotional activity but also disables that store as an install
    source; keep in `safe`, only touch in `performance`/`maximum`.
  dependencies: []
  rollback:
    supported: true

