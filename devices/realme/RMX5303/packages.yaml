# RMX5303 (realme C71) package classification database.
#
# Validated against a real unit on 2026-08-08 — see findings.md for the
# exact evidence trail (dumpsys package flags/permissions, on-device
# Settings "App info" labels captured via uiautomator, receiver/service
# inspection). Firmware at validation time:
#   realme/RMX5303EEA/RE60B8:15/AP3A.240905.015.A2/V.R4T2.1776089958:user/release-keys
#   (display id RMX5303GDPR_15_C.55, EEA/Germany region)
#
# The previous seed set (pre-device-validation) has been replaced: none
# of its guessed package names (com.heytap.mcs, com.heytap.usercenter,
# com.coloros.assistantscreen, com.coloros.karaoke, com.coloros.gamespaceui,
# com.nearme.romupdate, com.coloros.recommend, com.oppo.market,
# com.coloros.translate.engine) are actually installed on this unit — they
# simply never match during `relite plan`/`relite apply`, but kept stale
# guesses out of a "validated" database is misleading, so they were
# removed rather than left alongside real entries.
#
# Schema: see relite/classifier.py (PackageClassification / VALID_*).

# ============================================================
# HIGH CONFIDENCE — advertising / promotional (master plan section 13)
# ============================================================

- package: com.heytap.market
  category: [ads, cloud]
  confidence: high
  action:
    safe: disable
    performance: disable
    maximum: uninstall-user
  risk: medium
  reason: >
    "App Market" — OEM app store. Confirmed via on-device Settings app-info
    label. SYSTEM, PRIVILEGED, not persistent, no other installed package
    declares a dependency on it (checked via dumpsys package cross-refs).
    Drives Hot Apps/Hot Games promotion and install notifications. Losing
    it as an install source is an acceptable tradeoff since Play Store is
    installed and preferred by most users; still not touched in `safe`
    because bundled OEM-app updates route through it.
  dependencies: []
  rollback:
    supported: true

- package: com.heytap.pictorial
  category: [ads, recommendations]
  confidence: high
  action:
    safe: disable
    performance: disable
    maximum: uninstall-user
  risk: low
  reason: >
    "Lock Screen Magazine" — confirmed via on-device Settings app-info
    label. Serves curated/promotional lock-screen wallpapers; its
    companion `com.coloros.bootreg` references a
    "com.permission.haokan.PICTORIAL_USERAGREEMENT" user-agreement string,
    confirming a third-party content-partner (Haokan) tie-in. Textbook
    match for master plan section 13's "lock-screen promotional content".
  dependencies: []
  rollback:
    supported: true

- package: com.oplus.commercial
  category: [ads]
  confidence: high
  action:
    safe: disable
    performance: disable
    maximum: uninstall-user
  risk: medium
  reason: >
    "CommercialMidGround" — confirmed via on-device Settings app-info
    label; name is self-describing. Holds `android.permission.DISABLE_KEYGUARD`,
    which is the permission needed to show a full-screen overlay over the
    lock screen without unlocking — a known pattern for OEM lock-screen ad
    surfaces. PRIVILEGED but not persistent; no other package's manifest
    declares a dependency on it.
  dependencies: []
  rollback:
    supported: true

# ============================================================
# MEDIUM CONFIDENCE — recommendations / push (performance+, not safe)
# ============================================================

- package: com.oppo.quicksearchbox
  category: [recommendations]
  confidence: medium
  action:
    safe: keep
    performance: disable
    maximum: uninstall-user
  risk: low
  reason: >
    "Global Search" — confirmed label. Boot-starting OEM search overlay
    with content suggestions; PRIVILEGED but not persistent. Not the
    system's IME/assist provider. Kept in `safe` since some users use it
    as their home-screen search shortcut; the app drawer's own local
    search (ReLite Home) is a full replacement.
  dependencies: []
  rollback:
    supported: true

- package: com.coloros.lockassistant
  category: [recommendations]
  confidence: medium
  action:
    safe: keep
    performance: disable
    maximum: disable
  risk: medium
  reason: >
    Labeled simply "Assistant". Declares a push-message receiver
    (`.push.LockAssistantPushService`, `com.heytap.mcs.permission.SEND_PUSH_MESSAGE`)
    and a `.utils.PersistentService`, plus `SYSTEM_ALERT_WINDOW` and
    `CALL_PRIVILEGED`. Sits in the same lock-screen-content ecosystem as
    `com.heytap.pictorial` (shared MCS push channel). Not disabled in
    `safe` because the ambiguous name and `CALL_PRIVILEGED` permission
    warrant more caution than the unambiguous ad packages above.

    KNOWN ISSUE (found applying `performance` on real hardware,
    2026-08-08): `pm disable-user` for this package exits 0 but the
    platform silently refuses the change (`new state: default` instead
    of `new state: disabled-user`) — this OEM build appears to protect it
    from user-level disable independently of ReLite's own policy.
    `relite/actions.py::apply_plan` now detects this (checks for
    "disabled-user" in the command's stdout, not just exit code) and
    records it as an error rather than a false "ok". The action stays
    `disable` here since it's still the correct intent; applying it is a
    safe no-op on this device rather than a failure to route around.
  dependencies: []
  rollback:
    supported: true
  platform_limitation: >
    pm disable-user exits 0 but the platform silently refuses the
    change (new state: default instead of disabled-user) — confirmed
    on real hardware 2026-08-08. relite status treats this as a known
    limitation, not a compliance failure, since no action ReLite can
    take resolves it.

# ============================================================
# MEDIUM CONFIDENCE — analytics / diagnostics (maximum only)
# ============================================================

- package: com.oplus.stdid
  category: [analytics, diagnostics]
  confidence: medium
  action:
    safe: keep
    performance: keep
    maximum: disable
  risk: medium
  reason: >
    "StdID" — a cross-subsystem standard-ID service with an unusually
    broad permission set for its apparent purpose, including
    `android.permission.RECOVERY` and a `com.heytap.mcs.permission.SEND_PUSH_MESSAGE`-
    adjacent grant. Likely backs device/analytics identifiers used by
    other OPLUS apps' push and AI features. Not PRIVILEGED. Given the
    `RECOVERY` permission, only disabled in `maximum` pending more
    evidence on what depends on it.
  dependencies: []
  rollback:
    supported: true

- package: com.oplus.postmanservice
  category: [diagnostics]
  confidence: medium
  action:
    safe: keep
    performance: disable
    maximum: disable
  risk: medium
  reason: >
    Labeled "Diagnostic Tool" — not a push/ads service as its package name
    suggested before validation (corrected here). PRIVILEGED, with a
    notably broad permission set for a diagnostics tool: `ACCESS_FINE_LOCATION`,
    `INTERACT_ACROSS_USERS_FULL`, `com.oplus.permission.safe.FINGERPRINT`,
    `NETWORK_SETTINGS`, `SYSTEM_ALERT_WINDOW`. Believed to back
    remote/in-store diagnostic sessions (warranty service centers).
    Not needed for normal use; kept in `safe` only because "used by
    official repair diagnostics" is a real, if infrequent, use case.
  dependencies: []
  rollback:
    supported: true

- package: com.oppo.engineermode
  category: [diagnostics]
  confidence: medium
  action:
    safe: keep
    performance: keep
    maximum: disable
  risk: low
  reason: >
    Factory/engineer test-menu app. No user-facing "App info" screen was
    reachable via the Settings deep link (consistent with a
    hidden/non-launcher component). Not needed for normal use.
  dependencies: [com.oppo.engineermode.camera, com.oppo.engineermode.network]
  rollback:
    supported: true

- package: com.oppo.engineermode.camera
