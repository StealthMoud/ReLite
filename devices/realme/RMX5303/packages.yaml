  confidence: medium
  action:
    safe: keep
    performance: keep
    maximum: disable
  risk: low
  reason: Camera-specific factory test component of com.oppo.engineermode; same reasoning.
  dependencies: []
  rollback:
    supported: true

- package: com.oppo.engineermode.network
  category: [diagnostics]
  confidence: medium
  action:
    safe: keep
    performance: keep
    maximum: disable
  risk: low
  reason: Network-specific factory test component of com.oppo.engineermode; same reasoning.
  dependencies: []
  rollback:
    supported: true

- package: com.coloros.activation
  category: [cloud, optional]
  confidence: medium
  action:
    safe: keep
    performance: disable
    maximum: disable
  risk: low
  reason: >
    "E-warranty card" — device registration/warranty-activation nudge
