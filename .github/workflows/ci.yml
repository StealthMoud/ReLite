name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI never touches a real Android device — every job runs against mocked
# adb fixtures (Python) or the JVM/Android SDK toolchain only (Kotlin).
jobs:
  python:
    name: Python (lint, types, tests, secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install relite (editable, dev extras)
        run: pip install -e ".[dev]"

      - name: ruff
        run: ruff check relite tests

      - name: mypy
        run: mypy relite

      - name: pytest
        run: pytest -v

      - name: Validate profile schemas
        run: python -c "
          from relite.profiles import load_profiles;
          profiles = load_profiles();
          assert len(profiles) == 3, profiles;
          print('profiles/*.yaml valid:', sorted(profiles))"

      - name: Validate device.yaml schemas
        run: python -c "
          import pathlib
          from relite.device_metadata import load_device_metadata
          for p in pathlib.Path('devices').glob('*/*/device.yaml'):
              m = load_device_metadata(p)
              print(f'{p}: OK ({m.model}, {len(m.benchmark_targets)} benchmark targets, {len(m.pss_targets)} PSS targets)')
          "

      - name: Check generated package docs are up to date
        run: |
          for device_dir in devices/*/*/; do
            generated="$device_dir/PACKAGES.md"
            if [ -f "$generated" ]; then
              diff <(python scripts/generate_package_docs.py "$device_dir") "$generated" \
                || { echo "::error::$generated is stale — regenerate with scripts/generate_package_docs.py"; exit 1; }
            fi
          done

      - name: Check packaged relite/resources/ is in sync with profiles/ and devices/
        run: |
          python scripts/sync_resources.py
          git diff --exit-code -- relite/resources \
            || { echo "::error::relite/resources is stale — run scripts/sync_resources.py and commit the result"; exit 1; }

      - name: Build wheel and sdist
        run: |
          pip install build
          python -m build

      - name: Install wheel in a fresh venv outside the checkout and verify it's self-contained
        run: |
          python -m venv /tmp/relite-wheel-ci
          /tmp/relite-wheel-ci/bin/pip install dist/relite-*-py3-none-any.whl
          cd /tmp
          /tmp/relite-wheel-ci/bin/relite --version
          /tmp/relite-wheel-ci/bin/python -c "
          from relite.profiles import load_profiles
          from relite.classifier import load_database
          from relite.data_paths import devices_root
          profiles = load_profiles()
          assert len(profiles) == 3, profiles
          db = load_database(devices_root() / 'realme' / 'RMX5303')
          assert db.entries, 'no packaged RMX5303 package data found outside the checkout'
          print('wheel is self-contained:', sorted(profiles), len(db.entries), 'packages')
          "

      - name: Secret / identifier scan of committed fixtures
        run: |
          python - <<'PY'
          import pathlib
          import sys

          from relite.sanitize import find_leaks

          # Directories most likely to accumulate real device output over time.
          scan_dirs = ["devices", "research", "benchmarks/results", "tests/fixtures", "docs"]
          text_suffixes = {".md", ".yaml", ".yml", ".json", ".txt"}

          leaked = False
          for scan_dir in scan_dirs:
              for path in pathlib.Path(scan_dir).rglob("*"):
                  if not path.is_file() or path.suffix not in text_suffixes:
                      continue
                  hits = find_leaks(path.read_text(errors="ignore"))
                  if hits:
                      leaked = True
                      print(f"::error file={path}::possible identifying data: {hits}")

          if leaked:
              sys.exit(1)
          print("no identifying-data patterns found in committed fixtures")
          PY

  android:
    name: ReLite Home (Gradle build + unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/relite-home
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Lint
        run: ./gradlew lint --console=plain

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --console=plain

      - name: Assemble release APK
        run: ./gradlew assembleRelease --console=plain

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck scripts/*.sh benchmarks/scripts/*.sh
